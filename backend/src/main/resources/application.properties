# ==============================================================================
# Kisan Kalyan Backend - Application Configuration
# ==============================================================================

# Server Port
server.port=${SERVER_PORT:8080}

# PostgreSQL Database Connection (Configured via Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kisan_kalyan_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Bipul0406@161}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - Auto-create/update tables on new databases, or configure via env
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:KisanKalyanAgriculturalSuperSecretKey2026Secure256BitMinimumLength}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

