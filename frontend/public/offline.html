<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ऑफ़लाइन मोड (Offline Mode) | किसान कल्याण पोर्टल</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, 'Mukta', 'Outfit', sans-serif;
        background: #08130e;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .offline-card {
        background: #11221a;
        border: 1px solid #1f3d2f;
        border-radius: 24px;
        padding: 36px 28px;
        max-width: 460px;
        width: 100%;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }
      .icon-circle {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(16, 185, 129, 0.15);
        border: 2px solid #059669;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 38px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 1.45rem;
        font-weight: 800;
        color: #6ee7b7;
        margin-bottom: 10px;
      }
      p {
        font-size: 0.92rem;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .helpline-box {
        background: #0d1e17;
        border: 1px solid #1e3b2e;
        border-radius: 14px;
        padding: 14px 18px;
        margin-bottom: 24px;
        text-align: left;
      }
      .helpline-title {
        font-size: 0.75rem;
        color: #fbbf24;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
      }
      .helpline-num {
        font-size: 1.15rem;
        font-weight: 900;
        color: #fef08a;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .retry-btn {
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        color: #ffffff;
        border: none;
        padding: 12px 28px;
        border-radius: 12px;
        font-size: 0.96rem;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        box-shadow: 0 4px 14px rgba(5, 150, 105, 0.35);
        transition: transform 0.15s ease;
      }
      .retry-btn:hover {
        transform: translateY(-2px);
      }
      .footer-note {
        margin-top: 18px;
        font-size: 0.74rem;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="offline-card">
      <div class="icon-circle">🌾</div>
      <h1>आप ऑफ़लाइन हैं (You are Offline)</h1>
      <p>
        इंटरनेट कनेक्शन उपलब्ध नहीं है। स्लॉट बुकिंग, लाइव कतार और बैंक भुगतान स्थिति देखने के लिए सक्रिय इंटरनेट कनेक्शन आवश्यक है।
      </p>

      <div class="helpline-box">
        <div class="helpline-title">निशुल्क किसान हेल्पलाइन (24x7)</div>
        <a href="tel:18001801551" class="helpline-num">📞 1800-180-1551</a>
        <div style="font-size: 0.72rem; color: #94a3b8; margin-top: 4px;">फोन द्वारा स्लॉट एवं मंडी सहायता प्राप्त करें</div>
      </div>

      <button type="button" class="retry-btn" onclick="window.location.reload()">
        🔄 पुनः प्रयास करें (Retry Connection)
      </button>

      <div class="footer-note">
        भारत सरकार • कृषि एवं किसान कल्याण मंत्रालय
      </div>
    </div>
  </body>
</html>
