<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>किसान कल्याण - राष्ट्रीय कृषि खरीद एवं भंडारण प्रबंधन पोर्टल | SIH 2024</title>
    <meta name="description" content="भारत सरकार - स्मार्ट कृषि उपज खरीद, धर्मकांटा इलेक्ट्रॉनिक तौल, स्वचालित टोकन कतार एवं प्रत्यक्ष लाभ हस्तांतरण (DBT) पोर्टल" />
    
    <!-- PWA Web App Manifest & Mobile Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#045d3f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="किसान कल्याण" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      window.global = window;
      var global = window;
      try {
        if (localStorage.getItem('kisan_high_contrast') === 'true') {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
          if (document.body) {
            document.body.classList.add('dark-mode', 'high-contrast');
          } else {
            document.addEventListener('DOMContentLoaded', function() {
              document.body.classList.add('dark-mode', 'high-contrast');
            });
          }
        }
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
